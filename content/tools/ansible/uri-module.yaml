id: uri-module
tool: ansible
category: modules
name: ansible.builtin.uri
title: Call HTTP APIs
slug: uri-module
description: Interact with HTTP and HTTPS services and REST APIs.
syntax:
  - |-
    ansible.builtin.uri:
      url: https://api.example.com/health
      method: GET
      return_content: true
examples:
  - command: "ansible.builtin.uri:\\n  url:
      https://api.example.com/health\\n  method: GET"
    description: Make a GET request to a health endpoint.
flags:
  - flag: url
    meaning: Request URL.
  - flag: method
    meaning: HTTP method.
  - flag: status_code
    meaning: Expected HTTP status codes.
tags:
  - api
  - http
  - rest
difficulty: intermediate
common: true
dangerous: false
