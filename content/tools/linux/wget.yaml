id: linux-wget
tool: linux
category: networking
name: wget
title: Download files from the web
slug: wget
description: Downloads files and other resources from HTTP, HTTPS, and FTP servers.

syntax:
  - wget URL
  - wget -O filename URL

examples:
  - command: wget https://example.com/file.tar.gz
    description: Download a file from a URL.

  - command: wget -O app.tar.gz https://example.com/file.tar.gz
    description: Download a file and save it with a specific filename.

flags:
  - flag: "-O"
    meaning: Save the downloaded content using the specified filename.

  - flag: "-q"
    meaning: Run wget in quiet mode.

tags:
  - linux
  - networking
  - download
  - http
  - devops

difficulty: beginner
common: true
dangerous: false
