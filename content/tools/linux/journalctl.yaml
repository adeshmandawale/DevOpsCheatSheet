id: linux-journalctl
tool: linux
category: systemd
name: journalctl
title: View systemd logs
slug: journalctl
description: Queries and displays logs collected by the systemd journal.

syntax:
  - journalctl
  - journalctl -u service
  - journalctl -f

examples:
  - command: journalctl -u nginx
    description: Display logs generated by the nginx service.

  - command: journalctl -u nginx -f
    description: Follow nginx logs in real time.

  - command: journalctl -b
    description: Display logs from the current system boot.

flags:
  - flag: "-u"
    meaning: Show logs for a specific systemd unit.

  - flag: "-f"
    meaning: Follow new log entries as they are written.

  - flag: "-b"
    meaning: Show messages from a specific boot, with the current boot used by default.

  - flag: "-n"
    meaning: Show a specified number of recent log entries.

tags:
  - linux
  - systemd
  - logs
  - services
  - troubleshooting

difficulty: beginner
common: true
dangerous: false
