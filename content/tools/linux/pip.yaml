id: linux-pip
tool: linux
category: package-management
name: pip
title: Manage Python packages
slug: pip
description: Installs and manages Python packages from Python package indexes.

syntax:
  - python3 -m pip install package
  - python3 -m pip list
  - python3 -m pip uninstall package

examples:
  - command: python3 -m pip install requests
    description: Install the Python requests package.

  - command: python3 -m pip list
    description: List Python packages installed in the current environment.

  - command: python3 -m pip freeze
    description: Display installed packages in requirements-file format.

flags:
  - flag: "install"
    meaning: Install a Python package.

  - flag: "list"
    meaning: List installed Python packages.

  - flag: "uninstall"
    meaning: Remove an installed Python package.

  - flag: "freeze"
    meaning: Output installed packages and their versions.

tags:
  - linux
  - python
  - pip
  - packages
  - devops

difficulty: beginner
common: true
dangerous: false
