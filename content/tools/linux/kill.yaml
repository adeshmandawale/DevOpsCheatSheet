id: linux-kill
tool: linux
category: process-management
name: kill
title: Send a signal to a process
slug: kill
description: Sends a signal to a process, commonly used to request or force a process to terminate.

syntax:
  - kill PID
  - kill -9 PID
  - kill -SIGTERM PID

examples:
  - command: kill 1234
    description: Send the default termination signal to process 1234.

  - command: kill -9 1234
    description: Forcefully terminate process 1234.

flags:
  - flag: "-9"
    meaning: Send SIGKILL, which immediately terminates the process.

  - flag: "-SIGTERM"
    meaning: Send SIGTERM, allowing the process an opportunity to shut down cleanly.

tags:
  - linux
  - processes
  - signals
  - troubleshooting

difficulty: intermediate
common: true
dangerous: true
