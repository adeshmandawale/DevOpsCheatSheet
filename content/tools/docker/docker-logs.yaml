id: docker-logs
tool: docker
category: inspection
name: docker logs
title: View container logs
slug: docker-logs
description: Fetch and display the standard output and error logs generated by a container.
syntax:
  - docker logs <container>
  - docker logs -f <container>
examples:
  - command: docker logs myapp
    description: Display the logs from the myapp container.
  - command: docker logs -f myapp
    description: Follow the container logs in real time.
flags:
  - flag: -f, --follow
    meaning: Follow log output continuously.
  - flag: --tail
    meaning: Show only the specified number of lines from the end.
  - flag: -t, --timestamps
    meaning: Show timestamps with log output.
tags:
  - inspection
  - logs
  - debugging
difficulty: beginner
common: true
dangerous: false
