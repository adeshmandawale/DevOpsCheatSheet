id: kubectl-create-secret
tool: kubernetes
category: configuration
name: kubectl create secret
title: Create a Secret
slug: create-secret
description: Creates a Kubernetes Secret from literals, files, environment
  files, or other supported sources.
syntax:
  - kubectl create secret generic <name> --from-literal=<key>=<value>
examples:
  - command: kubectl create secret generic db-secret --from-literal=password=example
    description: Creates a generic Secret containing a key-value pair.
flags: []
tags:
  - secret
  - security
  - configuration
difficulty: beginner
common: true
dangerous: true
