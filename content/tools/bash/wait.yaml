id: bash-wait
tool: bash
category: jobs-processes
name: wait
title: Wait for background jobs
slug: wait
description: Wait for background processes to finish and return their exit status.

syntax:
  - wait
  - wait <pid>
  - wait %<job>

examples:
  - command: wait $!
    description: Wait for the most recently started background process.

  - command: wait 12345
    description: Wait for a specific process ID.

flags:
  []

tags:
  - jobs
  - processes
  - scripting

difficulty: intermediate
common: true
dangerous: false
