id: bash-pipeline
tool: bash
category: pipes-redirection
name: "|"
title: Pipe command output
slug: pipe
description: Send the standard output of one command directly into the standard
  input of another command.
syntax:
  - <command1> | <command2>
  - <command1> | <command2> | <command3>
examples:
  - command: ps aux | grep nginx
    description: Filter process output for nginx.
  - command: cat access.log | grep 500 | wc -l
    description: Count log lines containing HTTP 500 responses.
flags: []
tags:
  - pipes
  - redirection
  - commands
difficulty: beginner
common: true
dangerous: false
