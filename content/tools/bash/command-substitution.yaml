id: bash-command-substitution
tool: bash
category: expansion
name: $()
title: Use command substitution
slug: command-substitution
description: Execute a command and substitute its output into another command or variable.
syntax:
  - $(command)
  - VARIABLE=$(command)
examples:
  - command: today=$(date +%F)
    description: Store the current date in a variable.
  - command: 'echo "Files: $(ls | wc -l)"'
    description: Use command output inside another command.
flags: []
tags:
  - expansion
  - variables
  - scripting
difficulty: beginner
common: true
dangerous: false
