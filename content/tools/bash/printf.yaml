id: bash-printf
tool: bash
category: output
name: printf
title: Format and print output
slug: printf
description: Print formatted text and values using a predictable format.
syntax:
  - printf "<format>" <arguments>
  - printf "%s\n" "$VARIABLE"
examples:
  - command: 'printf "Name: %s\n" "$USER"'
    description: Print a formatted value.
  - command: printf "%-10s %5s\n" "Name" "Age"
    description: Format output into aligned columns.
flags: []
tags:
  - output
  - formatting
  - shell
difficulty: beginner
common: true
dangerous: false
