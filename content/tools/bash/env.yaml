id: bash-env
tool: bash
category: variables
name: env
title: Display environment variables
slug: env
description: Display or run commands with a modified environment.
syntax:
  - env
  - env | grep <variable>
  - env VARIABLE=value <command>
examples:
  - command: env
    description: Display the current environment.
  - command: env APP_ENV=production ./app
    description: Run a command with a temporary environment variable.
flags:
  - flag: -i
    meaning: Start with an empty environment.
  - flag: -u <name>
    meaning: Remove a variable from the environment.
tags:
  - environment
  - variables
  - configuration
difficulty: beginner
common: true
dangerous: false
