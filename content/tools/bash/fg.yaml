id: bash-fg
tool: bash
category: processes
name: fg
title: Bring a job to the foreground
slug: fg
description: Move a background or stopped shell job into the foreground.
syntax:
  - fg
  - fg %<job>
examples:
  - command: fg
    description: Bring the most recent background job to the foreground.
  - command: fg %1
    description: Bring job number 1 to the foreground.
