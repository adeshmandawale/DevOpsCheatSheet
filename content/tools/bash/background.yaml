id: bash-background
tool: bash
category: processes
name: "&"
title: Run a command in the background
slug: background
description: Start a command asynchronously so the shell can continue accepting commands.
syntax:
  - <command> &
  - <command> > output.log 2>&1 &
examples:
  - command: sleep 60 &
    description: Run sleep in the background.
  - command: ./deploy.sh > deploy.log 2>&1 &
    description: Run a deployment script in the background and capture output.
flags: []
tags:
  - processes
  - background
  - jobs
difficulty: beginner
common: true
dangerous: false
