id: bash-exit-status
tool: bash
category: conditions
name: $?
title: Read the last exit status
slug: exit-status
description: Read the exit status returned by the most recently executed command.
syntax:
  - echo $?
  - <command> && echo success
  - <command> || echo failed
examples:
  - command: mkdir test && echo $?
    description: Display the exit status of the mkdir command.
  - command: ./deploy.sh || echo "Deployment failed"
    description: Run a fallback command when deployment returns a non-zero status.
flags: []
tags:
  - exit-status
  - conditions
  - scripting
difficulty: beginner
common: true
dangerous: false
