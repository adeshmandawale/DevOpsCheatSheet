id: bash-export
tool: bash
category: variables
name: export
title: Export environment variables
slug: export
description: Mark shell variables so they are available to commands and child processes.
syntax:
  - export VARIABLE=value
  - export VARIABLE
  - export -p
examples:
  - command: export PATH="$PATH:/opt/bin"
    description: Add a directory to the PATH environment variable.
  - command: export APP_ENV=production
    description: Export an application environment variable.
flags:
  - flag: -p
    meaning: Display exported variables.
tags:
  - environment
  - variables
  - shell
difficulty: beginner
common: true
dangerous: false
