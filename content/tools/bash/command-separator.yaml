id: bash-command-separator
tool: ;
category: shell
name: ;
title: Separate commands
slug: command-separator
description: Separate commands so they execute sequentially regardless of the previous command's exit status.

syntax:
  - command1; command2

examples:
  - command: mkdir backup; echo 'Backup directory ready'
    description: Run the second command after the first command finishes.

  - command: cd /tmp; pwd
    description: Change directory and then print the current directory.

flags:
  []

tags:
  - shell
  - commands
  - control-flow

difficulty: beginner
common: true
dangerous: false
