id: bash-case
tool: bash
category: conditions
name: case
title: Match multiple conditions
slug: case
description: Match a value against multiple patterns and execute the corresponding commands.
syntax:
  - case <value> in <pattern>) <commands> ;; esac
examples:
  - command: case "$ENV" in prod) echo "Production";; dev) echo "Development";; esac
    description: Run different commands depending on the environment.
flags: []
tags:
  - conditions
  - scripting
  - patterns
difficulty: intermediate
common: true
dangerous: false
