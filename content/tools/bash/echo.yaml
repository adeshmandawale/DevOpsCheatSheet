id: bash-echo
tool: bash
category: output
name: echo
title: Print text or variables
slug: echo
description: Print text, variables, or command output to standard output.
syntax:
  - echo <text>
  - echo $VARIABLE
  - echo "<text>"
examples:
  - command: echo "Hello World"
    description: Print a message to the terminal.
  - command: 'echo "Home: $HOME"'
    description: Print text containing an environment variable.
flags:
  - flag: -n
    meaning: Do not print the trailing newline.
  - flag: -e
    meaning: Enable interpretation of backslash escape sequences.
tags:
  - output
  - variables
  - shell
difficulty: beginner
common: true
dangerous: false
