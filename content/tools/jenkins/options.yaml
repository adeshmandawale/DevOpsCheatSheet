id: jenkins-options
tool: jenkins
category: pipeline
name: options
title: Jenkins Pipeline Options
slug: options
description: Configure Pipeline-level execution options such as timeouts and
  build timestamps.
syntax:
  - options { ... }
examples:
  - command: |-
      options {
          timeout(time: 30, unit: 'MINUTES')
          timestamps()
      }
