id: terraform-provider
tool: terraform
category: providers
name: provider
title: Configure Terraform Provider
slug: provider
description: Configure a provider that Terraform uses to interact with an
  external API or platform.
syntax:
  - |-
    provider "aws" {
      region = var.region
    }
examples:
