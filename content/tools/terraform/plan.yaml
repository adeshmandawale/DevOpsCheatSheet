id: terraform-plan
tool: terraform
category: workflow
name: terraform plan
title: Preview Infrastructure Changes
slug: plan
description: Create an execution plan showing the infrastructure changes
  Terraform intends to make.
syntax:
  - terraform plan
  - terraform plan -out=tfplan
  - terraform plan -var='environment=staging'
examples:
  - command: terraform plan
    description: Preview changes without modifying infrastructure.
  - command: terraform plan -out=tfplan
    description: Save the generated plan to a file for later application.
flags:
  - flag: -out=<file>
    meaning: Save the generated execution plan to a file.
  - flag: -var
    meaning: Set a Terraform input variable.
  - flag: -var-file
    meaning: Load variable values from a file.
  - flag: -target
    meaning: Limit planning to a specific resource or module; use sparingly.
tags:
  - plan
  - workflow
  - preview
  - changes
difficulty: beginner
common: true
dangerous: false
